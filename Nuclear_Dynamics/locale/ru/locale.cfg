test-20t=Проведите ядерное испытание 20t.
test-15kt=Проведите ядерное испытание 15kt.
detonate-1Gt=Подорвите термоядерное оружие 1Gt.
stop-1Gt=Уничтожьте или иным образом предотвратите детонацию термоядерного оружия 1Gt после начала обратного отсчёта.
shoot-fusion=Выстрелите по термоядерному оружию.
lose-nuke=Умрите, имея при себе ядерный заряд или оружие.
15kt-15hrs=Проведите ядерное испытание 15kt за 15 часов.
nuke-self=Сгорите в огненном шаре собственного ядерного оружия.
destroy-everything=Мгновенно уничтожьте весь свой завод ядерным оружием.\n(Строго: используя только огненный шар и тепловой урон ядерного заряда, сократите завод с более чем 1000 машин до менее чем 20 — машины включают сборочные автоматы, печи, химзаводы и т.п., но НЕ буровые установки.)
multi-force-500t=Имейте более одной крупной ядерной державы в многопользовательской игре.\n(Строго: более одной силы должны провести ядерное испытание 500t).


