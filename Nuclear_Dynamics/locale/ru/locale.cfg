detonation-atomic-2-stage-10Mt-1=Взрыв мощностью 10Mt.\nДостаточно мощный, чтобы воронка была размером с небольшой завод, и наносит серьёзный урон в радиусе около 28 км. Номинальная безопасная дистанция — около 100 км.
detonation-atomic-2-stage-10Mt-2=Взрыв мощностью 10Mt.\nДостаточно мощный, чтобы воронка была размером с небольшой завод, и наносит серьёзный урон в радиусе около 28 км. Номинальная безопасная дистанция — около 100 км.
detonation-atomic-2-stage-10Mt-3=Взрыв мощностью 10Mt.\nДостаточно мощный, чтобы воронка была размером с небольшой завод, и наносит серьёзный урон в радиусе около 28 км. Номинальная безопасная дистанция — около 100 км.

detonation-atomic-2-stage-50Mt-1=Взрыв мощностью 50Mt.\nДостаточно мощный, чтобы воронка была размером со средний завод, и наносит серьёзный урон в радиусе около 50 км. Номинальная безопасная дистанция — около 180 км.
detonation-atomic-2-stage-50Mt-2=Взрыв мощностью 50Mt.\nДостаточно мощный, чтобы воронка была размером со средний завод, и наносит серьёзный урон в радиусе около 50 км. Номинальная безопасная дистанция — около 180 км.
detonation-atomic-2-stage-50Mt-3=Взрыв мощностью 50Mt.\nДостаточно мощный, чтобы воронка была размером со средний завод, и наносит серьёзный урон в радиусе около 50 км. Номинальная безопасная дистанция — около 180 км.

detonation-atomic-2-stage-100Mt-1=Взрыв мощностью 100Mt.\nДостаточно мощный, чтобы воронка была размером с крупный завод, и наносит серьёзный урон в радиусе около 65 км. Номинальная безопасная дистанция — около 240 км.
detonation-atomic-2-stage-100Mt-2=Взрыв мощностью 100Mt.\nДостаточно мощный, чтобы воронка была размером с крупный завод, и наносит серьёзный урон в радиусе около 65 км. Номинальная безопасная дистанция — около 240 км.
detonation-atomic-2-stage-100Mt-3=Взрыв мощностью 100Mt.\nДостаточно мощный, чтобы воронка была размером с крупный завод, и наносит серьёзный урон в радиусе около 65 км. Номинальная безопасная дистанция — около 240 км.

detonation-atomic-2-stage-1Gt-1=Взрыв мощностью 1Gt.\nДостаточно мощный, чтобы воронка была сопоставима с мегабазой, и наносит серьёзный урон в радиусе около 130 км. Номинальная безопасная дистанция — около 500 км.\nПо сути это просто необычный способ удалить сохранение.



nuclear-crater-mound=Куча грунта, выброшенная ядерным взрывом и образующая кромку воронки. Не крафтится; при добыче даёт камень.

FOGBANK=Странный материал из [font=default-bold]СЕКРЕТНО[/font], изготовленный с помощью [font=default-bold]СЕКРЕТНО[/font], используемый для [font=default-bold]СЕКРЕТНО[/font] внутри [font=default-bold]СЕКРЕТНО[/font]. Нужен для некоторых компактных термоядерных боеголовок, вероятно.

tritium-canister=Канистра с очищенным стабилизированным тритием.
tritium-breeder-fuel-cell=Ядерный ТВЭЛ, специально настроенный на производство трития.
advanced-tritium-breeder-fuel-cell=Ядерный ТВЭЛ с нейтронными отражателями для быстрого производства большого количества трития.

nuclear-test-site=Этот объект позволяет детально изучать детонацию ядерного оружия
fusion-test-site=Этот объект позволяет детально изучать детонацию термоядерного оружия

californium=Этот элемент крайне радиоактивен. Его критическая масса — всего 5 кг, и её можно ещё снизить с помощью нейтронных отражателей. Благодаря этому калифорний отлично подходит для создания малого ядерного оружия при сохранении полноценной детонации.

fire-shield-equipment=Это устройство даёт минимальную защиту, но не даёт тому, к чему оно подключено, загореться от ядерного или термобарического оружия, хотя и потребляет много энергии. (Не защищает от других видов урона огнём и от возгорания другими способами)

