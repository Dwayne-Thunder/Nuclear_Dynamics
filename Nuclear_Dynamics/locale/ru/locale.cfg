[warhead-description]

-atomic-0_1t=Боеголовка мощностью 0.1t.\nНа пределе того, насколько маленьким может быть ядерное оружие, но всё равно уничтожает одиночные цели: убивает практически всё, во что попадает, и наносит серьёзный урон в радиусе 5 м.
-atomic-0_5t=Боеголовка мощностью 0.5t.\nОчень ограниченный урон по площади, но уничтожает одиночные цели: убивает практически всё, во что попадает, и наносит серьёзный урон в радиусе 20 м.
-atomic-2t=Боеголовка мощностью 2t.\nОграниченный урон по площади, но уничтожает скопления целей: убивает практически всё в небольшой зоне и наносит серьёзный урон в радиусе 40 м.

-atomic-4t=Боеголовка мощностью 4t.\nОграниченный урон по площади, но уничтожает скопления целей и небольшие базы: убивает практически всё в умеренной зоне и наносит серьёзный урон в радиусе 60 м.
-atomic-8t=Боеголовка мощностью 8t.\nОграниченный урон по площади, но уничтожает отдельные базы: убивает практически всё в умеренной зоне и наносит серьёзный урон в радиусе 100 м. Безопасная дистанция — около 400 м.

-atomic-20t=Боеголовка мощностью 20t.\nСпособна сровнять с землёй средние базы и сильно повредить крупные, нанося серьёзный урон в радиусе 150 м. Безопасная дистанция — около 600 м.

-atomic-500t=Боеголовка мощностью 500t.\nСпособна уничтожить несколько соседних баз и вывести из строя базы на огромной площади, нанося серьёзный урон в радиусе 300 м. Безопасная дистанция — около 1.2 км.

-atomic-1kt=Боеголовка мощностью 1kt.\nСпособна уничтожить несколько соседних баз и вывести из строя базы на огромной площади, нанося серьёзный урон в радиусе 600 м. Безопасная дистанция — около 2.5 км.

-atomic-15kt=Боеголовка мощностью 15kt.\nДостаточно мощная, чтобы прицеливание по конкретной группе баз потеряло смысл: очищает огромную территорию и наносит серьёзный урон в радиусе 1.5 км. Номинальная безопасная дистанция — около 6 км.

-atomic-2-stage-15kt=Боеголовка мощностью 15kt.\nИспользование оружия в этом состоянии крайне расточительно.\nДостаточно мощная, чтобы прицеливание по конкретной группе баз потеряло смысл: очищает огромную территорию и наносит серьёзный урон в радиусе 1.5 км. Номинальная безопасная дистанция — около 6 км.

-atomic-2-stage-100kt=Боеголовка мощностью 100kt — крупнейшее практичное оружие.\nДостаточно мощная, чтобы прицеливание по конкретной группе баз потеряло смысл: очищает огромную территорию и наносит серьёзный урон в радиусе около 4 км. Номинальная безопасная дистанция — около 15 км.

-atomic-2-stage-1Mt=Боеголовка мощностью 1Mt.\nДостаточно мощная, чтобы полностью стереть с лица земли завод среднего размера — до самой травы — и нанести серьёзный урон в радиусе около 10 км. Номинальная безопасная дистанция — около 36 км.

-atomic-2-stage-5Mt=Боеголовка мощностью 5Mt.\nДостаточно мощная, чтобы полностью стереть с лица земли завод среднего размера — до самой травы — и нанести серьёзный урон в радиусе около 20 км. Номинальная безопасная дистанция — около 72 км.

-atomic-2-stage-10Mt=Боеголовка мощностью 10Mt.\nДостаточно мощная, чтобы воронка была размером с небольшой завод, и наносит серьёзный урон в радиусе около 28 км. Номинальная безопасная дистанция — около 100 км.

-atomic-2-stage-50Mt=Боеголовка мощностью 50Mt.\nДостаточно мощная, чтобы воронка была размером со средний завод, и наносит серьёзный урон в радиусе около 50 км. Номинальная безопасная дистанция — около 180 км.

-atomic-2-stage-100Mt=Боеголовка мощностью 100Mt.\nДостаточно мощная, чтобы воронка была размером с крупный завод, и наносит серьёзный урон в радиусе около 65 км. Номинальная безопасная дистанция — около 240 км.

-atomic-2-stage-1Gt=Боеголовка мощностью 1Gt.\nДостаточно мощная, чтобы воронка была сопоставима с мегабазой, и наносит серьёзный урон в радиусе около 130 км. Номинальная безопасная дистанция — около 500 км.\nПо сути это просто необычный способ удалить сохранение.

-thermobaric-1=Термобарическая боеголовка, наносящая умеренный урон в радиусе 30 м
-thermobaric-2=Термобарическая боеголовка, наносящая умеренный урон в радиусе 80 м
-thermobaric-3=Термобарическая боеголовка, наносящая умеренный урон в радиусе 120 м



