[technology-description]
californium-processing=Низкая критическая масса калифорния позволяет создавать невероятно маленькое ядерное оружие и применять его в гораздо большем числе ситуаций.
tritium-processing=Радиоактивный изотоп водорода, получаемый только в условиях высокой радиации внутри ядерного реактора. Полезен для подсветки часов, подсветки прицелов и создания термоядерного оружия.

basic-atomic-weapons=Первая попытка превысить критическую массу делящегося материала — заряд громоздкий и едва детонирует, но результат всё равно впечатляет.
atomic-bomb=Усовершенствование процесса даёт ряд мощностей на более компактных зарядах и позволяет создавать пригодное к применению оружие.

expanded-atomics=Используя больше делящегося материала и точную синхронизацию, можно добиться куда более разрушительной детонации.
full-fission-atomics=Исследования и опыт позволяют гораздо полнее детонировать материал и создавать гораздо более крупные боеголовки.
artillery-atomics=Сделать боеголовку способной пережить выстрел из артиллерийского орудия особенно сложно, но это даёт более удобный способ применения оружия.

californium-weapons=Калифорний позволяет создавать широкий спектр особых малых ядерных боеголовок и множество опасных видов оружия.
compact-californium-weapons=Нейтронные отражатели снижают критическую массу делящегося материала, открывая ещё более сомнительные варианты вооружения.

compact-full-fission-weapons=Нейтронные отражатели и калифорний в более крупном оружии позволяют создавать более мощные боеголовки и ещё худшие способы их применения.

fusion-weapons=Используя колоссальную энергию ядерного взрыва, тритий можно заставить сливаться — с апокалиптическими последствиями. Для тех случаев, когда уничтожить всё на [font=default-bold]половине[/font] карты уже недостаточно.\nВозьмите быстрый эвакуационный поезд.
compact-fusion-weapons=Уменьшение термоядерных зарядов снижает их потенциал, но позволяет применять их в более разнообразных — часто самоубийственных — ситуациях.

dense-neutron-flux=Нейтронные отражатели позволяют получать экзотические элементы при гораздо более коротких экспозициях.

thermobaric-weaponry=В этом оружии топлива гораздо больше, чем окислителя, поэтому образуется мощная ударная волна: топливо реагирует с воздухом. Урона немного, но на большой площади. Против одиночных крепких целей почти бесполезно, зато отлично косит рои слабых врагов. Также разжигает множество пожаров и создаёт много загрязнения.

