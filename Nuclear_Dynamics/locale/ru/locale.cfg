test-pack-atomic-20t-1=Чтобы завершить это исследование, поместите стандартный заряд 20t в ядерный полигон и убегайте.\nКогда оружие сработает, исследование будет завершено.\nЕсли выбрано другое исследование — не страшно: оно разблокируется, когда вы переключитесь на это.
test-pack-atomic-500t-1=Чтобы завершить это исследование, поместите стандартный заряд 500t в ядерный полигон и убегайте очень далеко.\nКогда оружие сработает, исследование будет завершено.\nЕсли выбрано другое исследование — не страшно: оно разблокируется, когда вы переключитесь на это.
test-pack-atomic-20t-3=Чтобы завершить это исследование, поместите очень компактный заряд 20t в ядерный полигон и убегайте. Когда оружие сработает, исследование будет завершено (наполовину).\nЕсли выбрано другое исследование — не страшно: оно разблокируется, когда вы переключитесь на это.
test-pack-atomic-15kt-1=Чтобы завершить это исследование, поместите стандартный заряд 15kt в ядерный полигон и уезжайте очень-очень далеко — просто продолжайте ехать. Когда оружие сработает, исследование будет завершено (наполовину).\nЕсли выбрано другое исследование — не страшно: оно разблокируется, когда вы переключитесь на это.
test-pack-atomic-2-stage-100kt-1=Чтобы завершить это исследование, настройте термоядерный полигон на взрыв 100kt (стандартный заряд 15kt+ и 2 единицы трития), загрузите заряд и тритий в здание и [font=default-bold]БЕГИТЕ[/font]. Можно уехать на машине, но медлить нельзя.\nКогда оружие сработает, исследование будет завершено.\nЕсли выбрано другое исследование — не страшно: оно разблокируется, когда вы переключитесь на это.



detonation-atomic-2-stage-15kt-1=Взрыв мощностью 15kt.\nИспользование оружия в этом состоянии крайне расточительно.\nДостаточно мощный, чтобы прицеливание по конкретной группе баз потеряло смысл: очищает огромную территорию и наносит серьёзный урон в радиусе 1.5 км. Номинальная безопасная дистанция — около 6 км.
