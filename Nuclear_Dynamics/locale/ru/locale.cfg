enable-nuclear-tests=Включить ядерные испытания

keep-atomic-bomb-without-changes=Для совместимости: позволяет разблокировать ванильную атомную бомбу без каких-либо изменений.






small-boom-material=Какой материал использовать для оружия малой мощности?\nКак у среднего/крупного — тот же материал, что и для более крупного оружия, обычно уран-235\nПо умолчанию True Nukes — калифорний-251\nЗависит от модов — то, что ставят другие установленные моды, иначе вариант True Nukes\nСвой — то, что указано в поле ниже.
small-boom-material-name=Точное внутриигровое имя используемого материала — баланс не гарантируется.

boom-material=Какой материал использовать для среднего и крупного оружия?\nПо умолчанию True Nukes — уран-235\nЗависит от модов — то, что ставят другие установленные моды, иначе уран-235\nСвой — то, что указано в поле ниже.
boom-material-name=Точное внутриигровое имя используемого материала — баланс не гарантируется.

dead-material=Какой материал использовать как инертный?\nПо умолчанию True Nukes — уран-238\nЗависит от модов — то, что ставят другие установленные моды, иначе уран-238\nСвой — то, что указано в поле ниже.
dead-material-name=Точное внутриигровое имя используемого материала — баланс не гарантируется.

computer-material=Какой материал использовать для схем?\nПо умолчанию True Nukes — процессорные блоки\nЗависит от модов — то, что ставят другие установленные моды, иначе процессорные блоки\nСвой — то, что указано в поле ниже.
computer-material-name=Точное внутриигровое имя используемого материала — баланс не гарантируется.

light-material=Какой материал использовать как лёгкий?\nПо умолчанию True Nukes — каркас низкой плотности\nЗависит от модов — то, что ставят другие установленные моды, иначе каркас низкой плотности\nСвой — то, что указано в поле ниже.
light-material-name=Точное внутриигровое имя используемого материала — баланс не гарантируется.

TN-mushroom-cloud-style-nuclear-flash=Если включено, ядерные взрывы вызывают яркую вспышку поблизости.\n\nПРЕДУПРЕЖДЕНИЕ ОБ ЭПИЛЕПСИИ:\nУ некоторых людей могут возникать эпилептические приступы при воздействии определённых частот света, мерцания или геометрических форм/узоров. В таком случае настоятельно рекомендуется отключить эту опцию!




optimise-100kt=Всегда используется для зарядов >=1Mt. Урон применяется только при загрузке чанка. Это может ломать многие другие моды, но работает быстрее, потребляет меньше памяти и позволяет более крупные заряды. Уже сгенерированные чанки всё равно обрабатываются, поэтому взрыв крупных зарядов на заводах по-прежнему медленный.

enable-fire-shield=Включает оборудование противопожарного щита. Оно нереалистично и нужно лишь для модовых машин, которые иначе слишком легко сгорают.

actually-generate-crater=Отключение полностью убирает воронку — это нужно в основном из-за проблем с уничтожением ресурсов, хотя и даёт очень существенный прирост производительности.

