[mod-setting-description]

nuke-random-fires=При включении ядерное оружие создаёт множество маленьких короткоживущих пожаров. Это может вызывать лаги, но даёт красивый эффект выжженной земли.
nuke-crater-noise=При включении к краям более крупных воронок добавляется шум, чтобы они выглядели естественнее.
destroy-resources-in-crater=Эту настройку можно использовать, чтобы ресурсы вообще не уничтожались ядерным оружием. Внешний вид переходов тайлов при этом не гарантируется.
nukes-cause-pollution=Ядерные взрывы вызывают загрязнение
retain-death-statistics=Может снижать производительность на крупных зарядах из-за огромного количества эффектов смерти кусак. (не влияет на 100kt+)
retain-death-statistics-for-trees=Может существенно снижать производительность на крупных зарядах из-за огромного количества эффектов гибели деревьев. (не влияет на 100kt+)

retain-death-statistics-small=Действует только для зарядов < 1kt, всё равно может вызывать проблемы с производительностью
retain-death-statistics-for-trees-small=Действует только для зарядов < 1kt, всё равно может вызывать проблемы с производительностью

large-nuke-fire-scaledown=Поскольку крупные ядерные заряды огромны, эта настройка уменьшает число пожаров в воронке. Это может существенно повысить производительность, но голая воронка выглядит менее опустошённой. (Значение 2 уменьшает число пожаров вдвое)
huge-nuke-fire-scaledown=Поскольку более крупные ядерные заряды огромны, эта настройка уменьшает число пожаров в воронке. Это может существенно повысить производительность, да и мало кто выживает достаточно близко, чтобы увидеть воронку; но голая воронка выглядит менее опустошённой. (Значение 2 уменьшает число пожаров вдвое)
really-huge-nuke-fire-scaledown=Поскольку заряд 100kt огромен, эта настройка уменьшает число пожаров в воронке. Это может существенно повысить производительность, да и мало кто выживает достаточно близко, чтобы увидеть воронку; но голая воронка выглядит менее опустошённой. (Значение 2 уменьшает число пожаров вдвое) Особенно важно для 100kt и может предотвратить вылет игры из-за нехватки памяти.

general-nuke-range-scaledown=Поскольку все ядерные заряды сильно бьют по производительности и наносят крошечный урон на огромной площади, эта настройка уменьшает зону поражения. Остальные уменьшения применяются поверх этого. (Значение 2 уменьшает радиус взрыва вдвое)
large-nuke-range-scaledown=Поскольку крупные ядерные заряды огромны, эта настройка уменьшает моделируемую дальность ударной волны и теплового урона. Это может существенно повысить производительность: чем дальше идёт волна, тем больше сущностей задевается. Объём загруженного мира не увеличивается, поэтому в неизведанных областях жёсткий обрез всё равно останется. По умолчанию обычно останавливается примерно там, где взрыв уже не уничтожает здания, а только повреждает их. (Значение 2 уменьшает радиус взрыва вдвое)
huge-nuke-range-scaledown=Поскольку заряды 15kt огромны, эта настройка уменьшает моделируемую дальность ударной волны и теплового урона. Это может существенно повысить производительность: чем дальше идёт волна, тем больше сущностей задевается. Объём загруженного мира не увеличивается, поэтому в неизведанных областях жёсткий обрез всё равно останется. По умолчанию обычно останавливается примерно там, где взрыв уже не уничтожает здания, а только повреждает их. (Значение 2 уменьшает радиус взрыва вдвое)
really-huge-nuke-range-scaledown=Поскольку заряды 100kt огромны, эта настройка уменьшает моделируемую дальность ударной волны и теплового урона. Это может существенно повысить производительность: чем дальше идёт волна, тем больше сущностей задевается. Объём загруженного мира не увеличивается, поэтому в неизведанных областях жёсткий обрез всё равно останется. По умолчанию обычно останавливается примерно там, где взрыв уже не уничтожает здания, а только повреждает их. (Значение 2 уменьшает радиус взрыва вдвое)





