[mod-name]
UltimateBelts_Logistics=Логистика Ultimate Belts

[mod-description]
UltimateBelts_Logistics=Погрузчики и сверхбыстрые манипуляторы для Ultimate Belts Space Age и/или Double Speed Belts. Скорости подстраиваются под ленты. В GUI погрузчика: разделение полос и переполнение механизмов.

[ubsa-loader-gui]
split-lanes=Разделять полосы
overfill-machines=Переполнять механизмы

[ubsa-loader-description]
summary=Погрузчик 1×1 под __1__.

[ubsa-inserter-description]
max-belt-speed=Максимальная поддерживаемая скорость конвейера: __1__ предметов/с
paired-belt=Парный конвейер: __1__

